<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de símbolos</title>
<style>
:root{--fondo:#1e1e1e;--panel:#2c2c2c;--borde:#3d3d3d;--texto:#e6e6e6;--tenue:#9a9a9a;--acento:#0d99ff;--laca:#c8321e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font:12px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:250px 1fr 1fr;grid-template-rows:44px 1fr;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--borde)}
header .sep{width:1px;height:22px;background:var(--borde);margin:0 4px}
button,select,input{font:inherit;color:var(--texto);background:#383838;border:1px solid var(--borde);border-radius:5px;padding:4px 8px}
button{cursor:pointer}
button:hover{background:#444}
button.activo{background:var(--acento);border-color:var(--acento);color:#fff}
button.primario{background:var(--laca);border-color:var(--laca);color:#fff}
input[type=number]{width:100%}
#estado{margin-left:auto;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
#estado.error{color:#ff7b6b}
#estado a{color:var(--acento)}
aside{background:var(--panel);border-right:1px solid var(--borde);display:flex;flex-direction:column;min-height:0}
aside h3{margin:0;padding:10px 12px 6px;font-size:11px;font-weight:600;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em}
#capas{list-style:none;margin:0;padding:0 6px;overflow:auto;flex:1 1 40%;min-height:80px}
#capas li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:default}
#capas li:hover{background:#353535}
#capas li.sel{background:#1c4a70}
#capas li.oculta .nom{opacity:.45}
#capas .ojo{background:none;border:0;padding:0 2px;color:var(--tenue)}
#capas .op{width:14px;text-align:center;color:var(--tenue)}
#capas .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#capas input{width:100%;padding:1px 4px}
.fila{display:flex;gap:4px;padding:6px 12px;flex-wrap:wrap}
#props{overflow:auto;border-top:1px solid var(--borde);flex:1 1 60%}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:0 12px 8px}
.rejilla label{display:flex;flex-direction:column;gap:2px;color:var(--tenue);font-size:11px}
.rejilla label.ancho{grid-column:1/-1}
.nota{color:var(--tenue);padding:0 12px 8px;font-size:11px}
#dos,#tres{position:relative;min-width:0;min-height:0}
#dos{border-right:1px solid var(--borde)}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--fondo);touch-action:none;transform-origin:0 0}
#dos svg path,#dos svg circle,#dos svg line{vector-effect:non-scaling-stroke}
/* capas propias para lo que se mueve: la tarjeta gráfica las desplaza sin repintar el lienzo */
#flotante,#sobre{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;will-change:transform}
#flotante,#sobre{transform-origin:0 0}
#flotante .capa{stroke:none}
#flotante .capa.unir{fill:var(--laca)}
#flotante .capa.restar{fill:var(--fondo)}
#lienzo .exacto{fill:var(--laca);pointer-events:none}
#lienzo .capa{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1;pointer-events:fill;cursor:move}
#lienzo .capa.restar{stroke:rgba(255,255,255,.55);stroke-dasharray:4 3}
/* provisional: se pintan las capas de abajo arriba; un píxel queda rojo si la última capa
   que lo cubre es «unir», que es justo unir y restar en orden. La exacta llega del servidor */
#lienzo.provisional .capa.unir{fill:var(--laca)}
#lienzo.provisional .capa.restar{fill:var(--fondo)}
#lienzo .capa:hover{stroke:var(--acento);stroke-width:1.5}
#dos .contorno{fill:none;stroke:var(--acento);stroke-width:1.5;pointer-events:none}
#sobre .caja{fill:none;stroke:var(--acento);stroke-width:1;pointer-events:none}
#sobre .asa{fill:#fff;stroke:var(--acento);stroke-width:1.2;cursor:nwse-resize;pointer-events:all}
#sobre .asa.rot{cursor:grab}
#sobre .nodo{fill:#fff;stroke:var(--acento);stroke-width:1;cursor:pointer;pointer-events:all}
#sobre .nodo.sel{fill:var(--acento)}
#lienzo .guia{fill:none;stroke:rgba(255,255,255,.08);stroke-dasharray:3 4;pointer-events:none}
#sobre .dibujo{fill:rgba(13,153,255,.12);stroke:var(--acento);pointer-events:none}
#sobre .corte{fill:none;stroke:#ff5a5a;stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
#sobre .corte-punto{fill:#ff5a5a;pointer-events:none}
#sobre .sugerencia{stroke:#a8dcff;stroke-width:2;opacity:.85;pointer-events:none}
#sobre .sugerencia-toque{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
#sobre .sugerencia-toque:hover+.sugerencia{stroke:#fff;opacity:1;stroke-width:3.5}
#sobre .guia-iman{stroke:#ff4fa3;stroke-width:1;stroke-dasharray:4 3;pointer-events:none}
#sobre .punto-iman{fill:none;stroke:#ff4fa3;stroke-width:1.5;pointer-events:none}
#lienzo .eje-simetria{stroke:#58b4ff;stroke-width:1.5;stroke-dasharray:8 5;pointer-events:none}
#lienzo .espejo-prov,#lienzo .espejo-prov .capa,#lienzo .tapa-prov{pointer-events:none}
#lienzo .tapa-prov{fill:var(--fondo);opacity:.72}
#lienzo:not(.provisional) .espejo-prov,#lienzo:not(.provisional) .tapa-prov{display:none}
.flotante-espejo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;will-change:transform;transform-origin:0 0;opacity:.85}
.flotante-espejo .capa{stroke:none}
.flotante-espejo .capa.unir{fill:var(--laca)}
.flotante-espejo .capa.restar{fill:var(--fondo)}
#lienzo .costura,#flotante .costura{fill:none;stroke:#ff5a5a;stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none}
#lienzo.herr-rect,#lienzo.herr-elipse,#lienzo.herr-cuchilla{cursor:crosshair}
#lienzo.herr-rect .capa,#lienzo.herr-elipse .capa,#lienzo.herr-cuchilla .capa{cursor:crosshair}
#lienzo.pan,#lienzo.pan .capa{cursor:grab}
#tres canvas{display:block}
.etiqueta{position:absolute;left:10px;bottom:8px;color:var(--tenue);font-size:11px;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three@0.170.0/build/three.module.js",
"three/addons/":"./vendor/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <header>
    <select id="abrir" title="Abrir símbolo"></select>
    <input id="nombre" title="Nombre del resultado: glb/<nombre>.glb" size="18" spellcheck="false">
    <span class="sep"></span>
    <button data-herr="mover" title="Mover (V)">↖ Mover</button>
    <button data-herr="rect" title="Rectángulo (R)">▭ Rect</button>
    <button data-herr="elipse" title="Elipse (O)">◯ Elipse</button>
    <button data-herr="cuchilla" title="Cortar (K): clic en una línea azul, o arrastra una recta de lado a lado (imán a bordes y esquinas; Mayús = ángulos de 15°; ⌘ sin imán)">✂ Cortar</button>
    <button id="bNodos" title="Editar nodos (Enter o doble clic)">⬩ Nodos</button>
    <span class="sep"></span>
    <button id="bDeshacer" title="Deshacer (⌘Z)">↶</button>
    <button id="bRehacer" title="Rehacer (⇧⌘Z)">↷</button>
    <span class="sep"></span>
    <button id="bGuardar" title="Guardar editor/<nombre>.json (⌘S); también se guarda solo">Guardar</button>
    <button id="bGenerar" class="primario" title="GLB con el acabado exacto de la galería">Generar GLB</button>
    <span id="estado"></span>
  </header>
  <aside>
    <h3>Capas</h3>
    <ul id="capas"></ul>
    <div class="fila">
      <button id="bSubir" title="Subir capa">↑</button>
      <button id="bBajar" title="Bajar capa">↓</button>
      <button id="bDuplicar" title="Duplicar (⌘D)">Duplicar</button>
      <button id="bBorrar" title="Borrar (Supr)">Borrar</button>
    </div>
    <div id="props"></div>
  </aside>
  <div id="dos"><svg id="lienzo"></svg><svg id="flotante"></svg><svg id="sobre"><g id="mundoSobre"><path id="contorno" class="contorno"/></g><g id="asas"></g></svg><div id="etiqueta2d" class="etiqueta"></div></div>
  <div id="tres"><div id="etiqueta3d" class="etiqueta"></div></div>
</div>
<script type="module">
// Editor de símbolos: capas 2D al estilo Figma + vista 3D. Lo sirve tools/editor.py.
// Coordenadas del mundo = las del símbolo: diámetro 1, centro en el origen, y hacia arriba.
// Cada capa guarda sus anillos en coordenadas locales y una transformación t
// (x, y, r en radianes, sx, sy), como un marco de Figma; las capas se combinan de abajo
// arriba: «unir» suma y «restar» quita lo que hay debajo.
// La geometría combinada la calcula solo el servidor (shapely, /api/combinar): es la
// misma que irá al GLB. Mientras llega, el lienzo pinta las capas en orden (exacto salvo
// el redondeo de esquinas) y lo rotula como provisional.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (q) => document.querySelector(q);
const lienzo = $('#lienzo');
const NOMBRE = /^[a-z0-9][a-z0-9-]*$/;
let doc = null, nombre = '', ajustesBase = null;
let sel = null, herramienta = 'mover', nodos = false, nodoSel = null;
let historia = [], puntero = -1, guardado = '', enServidor = false, idSig = 1;
let resultado = [], exacta = false, peticion = 0, espera = null;  // geometría exacta del servidor
const vista = { cx: 0, cy: 0, zoom: 500 };  // píxeles por unidad

// ---------- geometría de capas
const trig = (t) => [Math.cos(t.r), Math.sin(t.r)];
function aMundo(t, [u, v]) {
  const [c, s] = trig(t), a = u * t.sx, b = v * t.sy;
  return [t.x + c * a - s * b, t.y + s * a + c * b];
}
function aLocal(t, [x, y]) {
  const [c, s] = trig(t), dx = x - t.x, dy = y - t.y;
  return [(c * dx + s * dy) / t.sx, (-s * dx + c * dy) / t.sy];
}
function caja(capa) {
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const r of capa.anillos) for (const [u, v] of r) {
    b[0] = Math.min(b[0], u); b[1] = Math.min(b[1], v); b[2] = Math.max(b[2], u); b[3] = Math.max(b[3], v);
  }
  return b;
}
const esquinas = (b) => [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]];
const anillosMundo = (c) => c.anillos.map((r) => r.map((p) => aMundo(c.t, p)));
const capasMundo = () => doc.capas.filter((c) => c.visible).map((c) => ({ id: c.id, op: c.op, anillos: anillosMundo(c) }));
const capaSel = () => doc?.capas.find((c) => c.id === sel) || null;

function distSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  const k = l ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l)) : 0;
  return [Math.hypot(p[0] - a[0] - k * dx, p[1] - a[1] - k * dy), k];
}

// ---------- pantalla
// Las capas se dibujan en sus coordenadas locales dentro de dos transformaciones SVG
// (mundo→pantalla y capa→mundo): mover, girar, escalar o desplazar la vista solo cambia
// un atributo transform, nunca el trazado. El trazado de cada capa se cachea por su
// lista de anillos: quien cambia nodos pone una lista nueva (c.anillos = [...]).
// medidas del contenedor #dos, no del lienzo: durante un gesto el lienzo lleva un
// transform CSS y su getBoundingClientRect() devolvería la caja escalada
const dos = $('#dos');
function tam() { const r = dos.getBoundingClientRect(); return [r.width, r.height]; }
function aPantalla([x, y]) {
  const [w, h] = tam();
  return [w / 2 + (x - vista.cx) * vista.zoom, h / 2 - (y - vista.cy) * vista.zoom];
}
function deEvento(e) {
  const r = dos.getBoundingClientRect();
  return [(e.clientX - r.left - r.width / 2) / vista.zoom + vista.cx,
          -(e.clientY - r.top - r.height / 2) / vista.zoom + vista.cy];
}
// afines 2D como [a, b, c, d, e, f], igual que matrix() de SVG y CSS
function matMundo() {
  const [w, h] = tam(), z = vista.zoom;
  return [z, 0, 0, -z, w / 2 - vista.cx * z, h / 2 + vista.cy * z];
}
function matCapa(t) { const [c, s] = trig(t); return [c * t.sx, s * t.sx, -s * t.sy, c * t.sy, t.x, t.y]; }
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3],
  A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
function inv([a, b, c, d, e, f]) { const k = a * d - b * c; return [d / k, -b / k, -c / k, a / k, (c * f - d * e) / k, (b * e - a * f) / k]; }
const marcoMundo = () => `matrix(${matMundo().join(' ')})`;
const marcoCapa = (t) => `matrix(${matCapa(t).join(' ')})`;
const anillosD = (anillos) => anillos.map((r) => 'M' + r.map((p) => p[0].toFixed(6) + ' ' + p[1].toFixed(6)).join('L') + 'Z').join('');
const cacheD = new WeakMap();
function dCapa(c) {
  let d = cacheD.get(c.anillos);
  if (d === undefined) { d = anillosD(c.anillos); cacheD.set(c.anillos, d); }
  return d;
}
let dExacto = '', dContorno = null;

// Simetría en vivo (la geometría que cuenta la hace el servidor, simetrizar()). Aquí solo la
// vista provisional: la mitad que no manda, tapada a medias, y encima el reflejo de las
// capas recortadas a la mitad que manda. Copias de las capas y no un <use>: a los clones de
// un <use> no les llegan las reglas CSS del documento y el reflejo salía negro.
const G = 10;  // más que cualquier símbolo
function espejoProvisional(capas) {
  const S = doc.simetria;
  if (!S?.lr && !S?.ab) return '';
  const x0 = S.lr ? Math.min(0, S.x * G) : -G, x1 = S.lr ? Math.max(0, S.x * G) : G;
  const y0 = S.ab ? Math.min(0, S.y * G) : -G, y1 = S.ab ? Math.max(0, S.y * G) : G;
  const reflejos = [...(S.lr ? ['-1 1'] : []), ...(S.ab ? ['1 -1'] : []), ...(S.lr && S.ab ? ['-1 -1'] : [])];
  const tapas = [...(S.lr ? [[S.x > 0 ? -G : 0, -G, G, 2 * G]] : []), ...(S.ab ? [[-G, S.y > 0 ? -G : 0, 2 * G, G]] : [])];
  return `<defs><clipPath id="maestra" clipPathUnits="userSpaceOnUse"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/></clipPath></defs>` +
    tapas.map(([x, y, w, h]) => `<rect class="tapa-prov" x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('') +
    reflejos.map((k) => `<g class="espejo-prov" transform="scale(${k})" clip-path="url(#maestra)">${capas}</g>`).join('') +
    (S.lr ? `<line class="eje-simetria" y1="-1000" y2="1000"/>` : '') + (S.ab ? `<line class="eje-simetria" x1="-1000" x2="1000"/>` : '');
}

function dibujar() {
  let capas = '';
  let costuras = '';
  for (const c of doc.capas) if (c.visible) {
    capas += `<path class="capa ${c.op}" data-id="${c.id}" fill-rule="evenodd" transform="${marcoCapa(c.t)}" d="${dCapa(c)}"/>`;
    if (c.costuras?.length) costuras += `<path class="costura" data-costura="${c.id}" transform="${marcoCapa(c.t)}" d="${c.costuras.map((l) => 'M' + l.map((q) => q.join(' ')).join('L')).join('')}"/>`;
  }
  lienzo.innerHTML = `<g id="mundo" transform="${marcoMundo()}">
      <circle class="guia" r="0.5"/><line class="guia" x1="-1000" x2="1000"/><line class="guia" y1="-1000" y2="1000"/>
      <path class="exacto" fill-rule="evenodd" d="${exacta ? dExacto : ''}"/><g id="capasLienzo">${capas}</g>${espejoProvisional(capas)}${costuras}</g>`;
  lienzo.setAttribute('class', `herr-${herramienta}${espacio ? ' pan' : ''}${exacta ? '' : ' provisional'}`);
  sobre();
}
// lo que cambia en cada fotograma de un arrastre: la capa tocada, la selección y las asas
function refrescar(c) {
  if (c) {
    for (const p of lienzo.querySelectorAll(`path.capa[data-id="${c.id}"]`)) {  // la capa y sus reflejos
      p.setAttribute('transform', marcoCapa(c.t)); p.setAttribute('d', dCapa(c));
    }
  }
  sobre();
}
function vistaCambiada() { $('#mundo')?.setAttribute('transform', marcoMundo()); sobre(); }

// Zoom y desplazamiento de la vista: durante el gesto, el lienzo y las asas ya dibujados
// se escalan y desplazan con un transform CSS (la tarjeta gráfica, sin repintar), una vez
// por fotograma aunque el trackpad mande varios eventos; al terminar se redibujan nítidos.
// Redibujar en cada evento daba 30 fps con shou-circular (medido, Intel HD 6000).
let gesto = null, gestoPendiente = false, finGesto = null;
function empezarGesto() { if (!gesto) { gesto = { inicio: inv(matMundo()) }; lienzo.style.willChange = 'transform'; } }  // antes de tocar vista
function seguirGesto() {
  if (gestoPendiente) return;
  gestoPendiente = true;
  requestAnimationFrame(() => {
    gestoPendiente = false;
    if (!gesto) return;
    const css = `matrix(${mul(matMundo(), gesto.inicio).join(',')})`;
    lienzo.style.transform = css; $('#sobre').style.transform = css;
  });
}
function terminarGesto() {
  if (!gesto) return;
  gesto = null; lienzo.style.transform = ''; lienzo.style.willChange = ''; $('#sobre').style.transform = '';
  vistaCambiada();
}

// Arrastre de una capa entera (mover, escalar, girar): la capa se copia una vez a
// #flotante y en cada fotograma solo cambia el transform CSS de ese svg, que la tarjeta
// gráfica aplica sin repintar. Repintar una pieza de miles de puntos por fotograma
// costaba más de 16 ms (medido: 30 fps en shou-circular con Intel HD 6000).
const flotante = $('#flotante');
let flota = null;
function empezarFlotante(c) {
  const costura = lienzo.querySelector(`path[data-costura="${c.id}"]`);
  for (const el of [...lienzo.querySelectorAll(`path.capa[data-id="${c.id}"]`), costura]) el?.style.setProperty('visibility', 'hidden');
  flotante.innerHTML = `<g transform="${marcoMundo()}"><path class="capa ${c.op}" fill-rule="evenodd" transform="${marcoCapa(c.t)}" d="${dCapa(c)}"/>
    <path class="contorno" transform="${marcoCapa(c.t)}" d="${dCapa(c)}"/>
    ${costura ? `<path class="costura" transform="${marcoCapa(c.t)}" d="${costura.getAttribute('d')}"/>` : ''}</g>`;
  flota = { inicio: inv(mul(matMundo(), matCapa(c.t))), espejos: [] };
  // con simetría, su reflejo viaja igual: una copia por reflejo, movida con M·D·M (M, el
  // espejo en pantalla; D, el arrastre). Sin recortar al eje: es solo la vista provisional
  const S = doc.simetria, [, , , , ex, ey] = matMundo();
  const Ms = [...(S?.lr ? [[-1, 0, 0, 1, 2 * ex, 0]] : []), ...(S?.ab ? [[1, 0, 0, -1, 0, 2 * ey]] : []), ...(S?.lr && S?.ab ? [[-1, 0, 0, -1, 2 * ex, 2 * ey]] : [])];
  for (const M of Ms) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('class', 'flotante-espejo');
    el.innerHTML = `<g transform="matrix(${M.join(' ')})"><g transform="${marcoMundo()}"><path class="capa ${c.op}" fill-rule="evenodd" transform="${marcoCapa(c.t)}" d="${dCapa(c)}"/></g></g>`;
    flotante.after(el);
    flota.espejos.push({ el, M });
  }
}
function moverFlotante(c) {
  const D = mul(mul(matMundo(), matCapa(c.t)), flota.inicio);
  flotante.style.transform = `matrix(${D.join(',')})`;
  for (const { el, M } of flota.espejos) el.style.transform = `matrix(${mul(mul(M, D), M).join(',')})`;
}
function soltarFlotante() { flotante.innerHTML = ''; flotante.style.transform = ''; for (const { el } of flota.espejos) el.remove(); flota = null; }

function sobre() {
  const c = capaSel(), cont = $('#contorno');
  $('#mundoSobre').setAttribute('transform', marcoMundo());
  let html = '';
  const d = c && c.visible && !flota ? dCapa(c) : '';  // al arrastrar, el contorno va en #flotante
  if (dContorno !== d) { cont.setAttribute('d', d); dContorno = d; }  // miles de puntos: solo si cambia
  if (c && c.visible) {
    cont.setAttribute('transform', marcoCapa(c.t));
    if (nodos) {
      c.anillos.forEach((r, k) => r.forEach((p, i) => {

// Vista provisional: extrusión SIN canto. El bisel de three.js (ExtrudeGeometry) hunde el
// contorno un canto entero y en las esquinas que entran (redondeadas a 0,6 × canto) lo
// cruzaba consigo mismo: caras torcidas en los huecos que el GLB no tiene. El canto de
// verdad llega con la malla real del servidor (pedirMalla).
function extruir(polis) {  // [[exterior, hueco...], ...] -> sólido de caras rectas
  const { fondo, color } = doc.ajustes;
  laca.color.setRGB(color[0], color[1], color[2], THREE.LinearSRGBColorSpace);
  const limpio = (r) => { const p = r.map(([x, y]) => new THREE.Vector2(x, y)); if (p.length > 1 && p[0].equals(p.at(-1))) p.pop(); return p; };
  const formas = polis.map((poli) => {
    const f = new THREE.Shape(limpio(poli[0]));
    f.holes = poli.slice(1).map((r) => new THREE.Path(limpio(r)));
    return f;
  });
  const g = new THREE.ExtrudeGeometry(formas, { depth: fondo, curveSegments: 1, bevelEnabled: false });
  g.translate(0, 0, -fondo / 2);
  return g;
}
function construir3D() {
  poner(new THREE.Mesh(extruir(resultado), laca), 'Planta exacta, sin canto · calculando el acabado real…');
  pedirMalla();
}
// la malla real, la misma que escribe «Generar» (/api/previa, 0,7–1,9 s medido); una
// edición en medio cambia `peticion` y la respuesta vieja se descarta
async function pedirMalla() {
  const id = peticion;
  let datos;
  try {
    const r = await fetch('/api/previa', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc, capas: capasMundo() }) });
    if (!r.ok) throw new Error((await r.json()).error);
    datos = await r.arrayBuffer();
  } catch (err) {
    if (id === peticion) $('#etiqueta3d').textContent = `Planta exacta, sin canto · el acabado real falló: ${err.message}`;
    return;
  }
  if (id !== peticion) return;
  new GLTFLoader().parse(datos, '', (g) => { if (id === peticion) poner(g.scene, 'Acabado real (la malla que se genera)'); });
}
// Mientras se edita, el 3D sigue al ratón: cada capa que une es su propio sólido, extruido
// una vez en coordenadas locales y colocado con su t; arrastrar solo cambia su matriz.
// Las restas y el redondeo aparecen cuando llega la geometría exacta.
const solidos = new WeakMap();  // anillos -> { g, clave }
function solidoCapa(c) {
  const clave = `${doc.ajustes.fondo},${doc.ajustes.bisel}`;
  let s = solidos.get(c.anillos);
  if (!s || s.clave !== clave) { s = { g: extruir([c.anillos]), clave }; solidos.set(c.anillos, s); }
  return s.g;
}
function colocar(m, t) { m.position.set(t.x, t.y, 0); m.rotation.set(0, 0, t.r); m.scale.set(t.sx, t.sy, 1); }
function provisional3D() {
  const grupo = new THREE.Group();
  for (const c of doc.capas) if (c.visible && c.op === 'unir') {
    const m = new THREE.Mesh(solidoCapa(c), laca);
    m.userData = { id: c.id, cache: true };
    colocar(m, c.t); grupo.add(m);
  }
  const restas = doc.capas.some((c) => c.visible && c.op === 'restar');
  const falta = [...(restas ? ['las restas'] : []), ...(doc.simetria ? ['la simetría'] : [])].join(' ni ');
  poner(grupo, `Vista 3D provisional${falta ? ` (sin ${falta})` : ''} · calculando la exacta…`);
}
let capa3dPendiente = null;  // como mucho una actualización por fotograma
function seguir3D(c) {
  if (capa3dPendiente) { capa3dPendiente = c; return; }
  capa3dPendiente = c;
  requestAnimationFrame(() => {
    const c = capa3dPendiente; capa3dPendiente = null;
    const m = modelo?.children?.find((o) => o.userData.id === c.id);
    if (!m) return;
    m.geometry = solidoCapa(c);  // mismo objeto salvo que se editaran los nodos
    colocar(m, c.t); pintar3d = true;
  });
}
function encuadrar() {  // como visor.html: la esfera que envuelve el símbolo cabe en el campo de visión
  const pts = doc.capas.filter((c) => c.visible).flatMap((c) => anillosMundo(c).flat());
  if (!pts.length) return;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const radio = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), doc.ajustes.fondo) / 2;
  const fov = THREE.MathUtils.degToRad(camara.fov) / 2;
  const dist = radio / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camara.aspect))) * 1.1;
  controles.target.set(cx, cy, 0); distObjetivo = null;
  camara.position.set(cx, cy, 0).add(new THREE.Vector3(0.35, -0.22, 1).normalize().multiplyScalar(dist));
  pintar3d = true;
}
function tamano3d() {
  const r = caja3.getBoundingClientRect();
  render.setSize(r.width, r.height); camara.aspect = r.width / r.height; camara.updateProjectionMatrix();
  pintar3d = true;
}
new ResizeObserver(() => { tamano3d(); if (doc) vistaCambiada(); }).observe(caja3);
(function bucle(ahora = performance.now()) {
  requestAnimationFrame(bucle);
  seguirZoom(Math.min(ahora - ultimoFotograma, 100)); ultimoFotograma = ahora;
  if (controles.update() || pintar3d) { pintar3d = false; render.render(escena, camara); dibujados3d++; }
})();

// ---------- archivos
function estado(txt, error = false, auto = false) {
  const s = $('#estado'); s.innerHTML = txt; s.classList.toggle('error', error);
  s.dataset.auto = auto ? '1' : '';  // los avisos del guardado automático ceden su sitio
}
async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) } : {});
  return r.json();
}
function nombreValido(callado = false) {
  nombre = $('#nombre').value.trim();
  if (NOMBRE.test(nombre)) return true;
  if (!callado) estado('Nombre: minúsculas, números y guiones', true);
  return false;
}
function yaGuardado() {
  guardado = JSON.stringify(doc); enServidor = true; nombreGuardado = nombre; titulo();
  history.replaceState(null, '', `?s=${nombre}`);  // al recargar se abre este documento
}
async function guardar(auto = false) {
  if (!nombreValido(auto)) return;
  const texto = JSON.stringify(doc);
  const r = await api('/api/guardar', { nombre, doc });
  if (r.error) return estado(auto ? `No se guardó solo: ${r.error}` : r.error, true);
  if (JSON.stringify(doc) === texto) yaGuardado(); else { enServidor = true; nombreGuardado = nombre; titulo(); }
  // el automático no tapa otro mensaje (el resultado de un corte, «Generando GLB…»…)
  if (auto && ($('#estado').textContent && !$('#estado').dataset.auto || generando)) return;
  estado(auto ? `Guardado automático ${new Date().toLocaleTimeString('es')}` : `Guardado en editor/${nombre}.json`, false, auto);
}
$('#bGuardar').addEventListener('click', () => guardar());
// guardado automático 1,5 s después del último cambio
let tGuardar = null, nombreGuardado = null;
function programarGuardado() {
  if (!enServidor) return;
  clearTimeout(tGuardar);
  tGuardar = setTimeout(() => { if (doc && JSON.stringify(doc) !== guardado) guardar(true); }, 1500);
}
// al cerrar la pestaña, lo de ese último segundo y medio. sendBeacon admite 64 KB y un
// símbolo grande pasa de 100 (shou-circular: 105): las capas cuyos nodos no cambiaron
// desde el último guardado viajan sin ellos (anillos "=") y el servidor los completa
addEventListener('pagehide', () => {
  if (!doc || JSON.stringify(doc) === guardado || !nombreValido(true)) return;
  const parche = enServidor && nombre === nombreGuardado;
  const base = new Map(parche ? JSON.parse(guardado).capas.map((c) => [c.id, JSON.stringify(c.anillos)]) : []);
  const enviado = { ...doc, capas: doc.capas.map((c) => (base.get(c.id) === JSON.stringify(c.anillos) ? { ...c, anillos: '=' } : c)) };
  navigator.sendBeacon('/api/guardar', JSON.stringify({ nombre, doc: enviado, parche }));
});
let generando = false;
$('#bGenerar').addEventListener('click', async () => {
  if (!nombreValido()) return;
  estado('Generando GLB…');
  generando = true;
  const r = await api('/api/generar', { nombre, doc, capas: capasMundo() }).finally(() => { generando = false; });
  if (r.error) return estado(r.error, true);
  yaGuardado();
  estado(`glb/${nombre}.glb · ${r.piezas} pieza(s) · ${r.triangulos.toLocaleString('es')} triángulos · ` +
    `${r.estanca ? 'malla cerrada' : '<b>malla abierta</b>'} · <a href="visor.html?s=${nombre}" target="_blank">visor</a>`, !r.estanca);
  new GLTFLoader().load(`glb/${nombre}.glb?v=${Date.now()}`, (g) => poner(g.scene, `glb/${nombre}.glb — acabado exacto`));
});

function migrar(d) {  // documentos anteriores al campo version: mismo formato
  d.version ??= 1;
  return d;
}
async function abrir(s) {
  if (JSON.stringify(doc) !== guardado && doc?.capas.length && !confirm('Hay cambios sin guardar. ¿Descartarlos?')) {
    $('#abrir').value = ''; return;
  }
  let r;
  if (s === '+nuevo') r = { nombre: 'simbolo-nuevo', doc: { version: 1, origen: null, capas: [], ajustes: { ...ajustesBase } } };
  else r = await api(`/api/abrir?s=${encodeURIComponent(s)}`);
  if (r.error) return estado(r.error, true);
  doc = migrar(r.doc); nombre = r.nombre; $('#nombre').value = nombre;
  enServidor = r.nombre === s;  // abierto de editor/<nombre>.json
  nombreGuardado = enServidor ? r.nombre : null;
  idSig = Math.max(0, ...doc.capas.map((c) => c.id || 0)) + 1;
  for (const c of doc.capas) c.id ??= idSig++;
  sel = null; nodos = false; nodoSel = null; herramienta = 'mover';
  const [w, h] = tam(); Object.assign(vista, { cx: 0, cy: 0, zoom: Math.min(w, h) * 0.8 });
  historia = []; puntero = -1; guardado = JSON.stringify(doc);
  if (s !== '+nuevo') history.replaceState(null, '', `?s=${s}`);
  $('#abrir').value = '';
  commit(); encuadrar();
  estado(s === '+nuevo' ? 'Documento en blanco' : `Abierto ${s} · ${doc.capas.length} capa(s)` +
    (r.nombre !== s ? ` · se guardará como ${r.nombre}` : ''), false, true);
}
$('#abrir').addEventListener('change', (e) => e.target.value && abrir(e.target.value));

// para las pruebas de tests/: estado de solo lectura
window.editor = { triangulos3d: () => { let n = 0; modelo?.traverse((o) => { if (o.geometry) n += (o.geometry.index?.count ?? o.geometry.attributes.position.count) / 3; }); return n; }, guias: () => guiasMover, marca: () => marcaIman, bordes: () => bordes, aCliente: (x, y) => { const r = dos.getBoundingClientRect(), [px, py] = aPantalla([x, y]); return [r.left + px, r.top + py]; }, dibujados3d: () => dibujados3d, distancia3d: () => camara.position.distanceTo(controles.target), doc: () => doc, exacta: () => exacta, resultado: () => resultado, guardado: () => JSON.stringify(doc) === guardado };

const lista = await api('/api/simbolos');
ajustesBase = lista.ajustes;
$('#abrir').innerHTML = `<option value="">Abrir…</option><option value="+nuevo">Nuevo en blanco</option>` +
  (lista.editados.length ? `<optgroup label="Editados">${lista.editados.map((n) => `<option>${n}</option>`).join('')}</optgroup>` : '') +
  `<optgroup label="Símbolos">${lista.simbolos.map((n) => `<option>${n}</option>`).join('')}</optgroup>`;
tamano3d();
await abrir(new URLSearchParams(location.search).get('s') || lista.editados[0] || 'shou-circular');
</script>
