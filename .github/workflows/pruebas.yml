# Pruebas en cada push: el servidor (pytest) y el recorrido completo del editor en Chrome.
name: pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: .venv/bin/pytest tests/ -q
      - name: Recorrido del editor en Chrome
        run: npm run test:ui
        env:
          CHROME: /usr/bin/google-chrome
